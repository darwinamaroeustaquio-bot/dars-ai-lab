name: DARS Omniscient core tests

on:
  push:
    branches: [main, dars-omniscient-foundation, dars-mt5-execution-bridge-foundation]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
